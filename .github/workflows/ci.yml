name: Official0293 native validation
on:
  push:
    branches: [main, sky-v0293-rollout]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sky_archive_sha256:
        description: Optional expected official Darwin ARM64 archive SHA256
        required: false
      sky_binary_sha256:
        description: Optional expected official extracted CLI SHA256
        required: false
permissions:
  contents: read
concurrency:
  group: native0293-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anzellai/sky
          ref: v0.29.3
          path: .ci-toolchain
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify official archive, optional pins and exact0293 version
        env:
          ARCHIVE_SHA: ${{ inputs.sky_archive_sha256 }}
          BINARY_SHA: ${{ inputs.sky_binary_sha256 }}
        run: python3 tools/ci0293/install-sky.py --archive-sha "$ARCHIVE_SHA" --binary-sha "$BINARY_SHA" --out "$RUNNER_TEMP/official-sky0293"
      - name: Existing safe validation and native build, no application launch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/ci0293/hosted.py sky-env --head "$SOURCE_SHA" --tools "$RUNNER_TEMP/official-sky0293"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sky-env-native0293-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sky-env-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 7
